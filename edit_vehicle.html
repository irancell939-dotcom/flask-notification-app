{% extends "base.html" %}
{% block title %}ویرایش خودرو{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-edit"></i> ویرایش اطلاعات خودرو</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <h6 class="border-bottom pb-2 mb-3">اطلاعات پلاک</h6>
                    <div class="row mb-3" dir="ltr">
                        <div class="col-3">
                            <label class="small">دو رقم</label>
                            <input type="text" name="plate_1" class="form-control text-center"
                                   value="{{ vehicle.plate_1 }}" maxlength="2" required>
                        </div>
                        <div class="col-3">
                            <label class="small">حرف فارسی</label>
                            <input type="text" name="plate_2" class="form-control text-center"
                                   value="{{ vehicle.plate_2 }}" maxlength="1" required>
                        </div>
                        <div class="col-3">
                            <label class="small">سه رقم</label>
                            <input type="text" name="plate_3" class="form-control text-center"
                                   value="{{ vehicle.plate_3 }}" maxlength="3" required>
                        </div>
                        <div class="col-3">
                            <label class="small">کد شهرستان</label>
                            <input type="text" name="plate_4" class="form-control text-center"
                                   value="{{ vehicle.plate_4 }}" maxlength="2" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>نام راننده</label>
                            <input type="text" name="driver_name" class="form-control" value="{{ vehicle.driver_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>نوع خودرو</label>
                            <input type="text" name="vehicle_type" class="form-control" value="{{ vehicle.vehicle_type }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>رنگ خودرو</label>
                            <input type="text" name="color" class="form-control" value="{{ vehicle.color }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>شماره تلفن</label>
                            <input type="text" name="phone" class="form-control" value="{{ vehicle.phone }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>سمت</label>
                            <input type="text" name="position" class="form-control" value="{{ vehicle.position or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>شماره دانشجویی</label>
                            <input type="text" name="student_id" class="form-control" value="{{ vehicle.student_id or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>رشته تحصیلی</label>
                            <input type="text" name="major" class="form-control" value="{{ vehicle.major or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>پارکینگ</label>
                            <input type="text" name="parking" class="form-control" value="{{ vehicle.parking or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>تاریخ اعتبار (شمسی)</label>
                            <input type="text" name="validity_date" class="form-control"
                                   value="{{ vehicle.get_shamsi_validity() }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>درب ورود</label>
                            <input type="text" name="entrance_gate" class="form-control" value="{{ vehicle.entrance_gate or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>معرف</label>
                            <input type="text" name="referrer" class="form-control" value="{{ vehicle.referrer or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>محل بایگانی</label>
                            <input type="text" name="archive_location" class="form-control" value="{{ vehicle.archive_location or '' }}">
                        </div>
                        <div class="col-12 mb-3">
                            <label>توضیحات</label>
                            <textarea name="description" class="form-control" rows="3">{{ vehicle.description or '' }}</textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('vehicle_detail', id=vehicle.id) }}" class="btn btn-secondary">انصراف</a>
                        <button type="submit" class="btn btn-warning">بروزرسانی</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
