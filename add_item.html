{% extends "base.html" %}

{% block title %}افزودن مورد جدید{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-plus-circle"></i> افزودن اطلاعیه جدید</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label">عنوان اطلاعیه</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">توضیحات</label>
                            <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="expiry_date" class="form-label">تاریخ انقضا (شمسی)</label>
                            <input type="text" class="form-control" id="expiry_date" name="expiry_date" placeholder="مثال: 1403/01/01" required>
                            <small class="text-muted">فرمت تاریخ باید به صورت سال/ماه/روز باشد.</small>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="is_important" name="is_important">
                            <label class="form-check-label" for="is_important">علامت‌گذاری به عنوان مهم</label>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a href="{{ url_for('index') }}" class="btn btn-secondary me-md-2">انصراف</a>
                            <button type="submit" class="btn btn-success">ذخیره اطلاعیه</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
