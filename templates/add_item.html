{% extends "base.html" %}
{% block title %}افزودن اطلاعیه{% endblock %}

{% block content %}
<h1 class="page-title">افزودن اطلاعیه جدید</h1>

<div class="notification-card">
    <form method="POST" action="{{ url_for('add_item') }}">
        <div style="margin-bottom: 18px;">
            <label for="title" style="display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; font-size: 14px;">
                عنوان اطلاعیه <span style="color: #e74c3c;">*</span>
            </label>
            <input type="text" id="title" name="title" required
                   style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; font-family: Tahoma; transition: border-color 0.2s;"
                   placeholder="عنوان اطلاعیه را وارد کنید">
        </div>

        <div style="margin-bottom: 18px;">
            <label for="description" style="display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; font-size: 14px;">
                توضیحات <span style="color: #e74c3c;">*</span>
            </label>
            <textarea id="description" name="description" required rows="6"
                      style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-family: Tahoma; resize: vertical; line-height: 1.6;"
                      placeholder="متن کامل اطلاعیه را وارد کنید..."></textarea>
        </div>

        <div style="margin-bottom: 18px;">
            <label for="expiry_date" style="display: block; margin-bottom: 8px; font-weight: bold; color: #2c3e50; font-size: 14px;">
                تاریخ انقضا (شمسی) <span style="color: #e74c3c;">*</span>
            </label>
            <input type="text" id="expiry_date" name="expiry_date" required
                   style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 15px; font-family: Tahoma; direction: ltr; text-align: right;"
                   placeholder="1405/01/15">
            <p style="font-size: 12px; color: #888; margin-top: 6px;">
                فرمت تاریخ: سال/ماه/روز (مثال: 1405/01/15)
            </p>
        </div>

        <div style="background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" name="is_important" 
                       style="width: 20px; height: 20px; cursor: pointer;">
                <span style="font-weight: bold; color: #2c3e50; font-size: 14px;">
                    علامت‌گذاری به عنوان مهم
                </span>
            </label>
            <p style="font-size: 12px; color: #888; margin: 8px 0 0 30px;">
                اطلاعیه‌های مهم با برچسب قرمز نمایش داده می‌شوند
            </p>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <a href="{{ url_for('index') }}" 
               style="flex: 1; min-width: 120px; background: #6c757d; color: white; padding: 14px; border-radius: 10px; text-decoration: none; text-align: center; font-weight: bold; font-size: 15px;">
                انصراف
            </a>
            <button type="submit" 
                    style="flex: 2; min-width: 140px; background: linear-gradient(135deg, #28a745, #20c997); color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; font-family: Tahoma;">
                ذخیره اطلاعیه
            </button>
        </div>
    </form>
</div>
{% endblock %}
